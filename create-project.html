<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>

  <div class="sidebar">
    <div class="logo">⬛ Bugiz</div>
    <a href="index.html" class="nav-item">Tickets</a>
    <a href="projects.html" class="nav-item">Projects</a>

    <select 
      id="status-nav" 
      class="status-dropdown"
      onchange="if (this.value) window.location.href = this.value;"
    >
      <option value="">Status</option>
      <option value="completed.html">Completed</option>
      <option value="in-progress.html">In Progress</option>
      <option value="overdue.html">Overdue</option>
    </select>

    <a href="create-ticket.html" class="nav-item">Create Ticket</a>
    <a href="create-project.html" class="nav-item"><strong>Create Project</strong></a>
    <a href="create-user.html" class="nav-item">Create User</a>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="search">
        <input placeholder="Search">
      </div>
      <div class="profile">
        <div class="avatar"></div>
        <div>UserName<br>
        <a href="login.html">Log out</a>
      </div>
    </div>
  </div>

  <div class="content form-center">
    <h1>Create New Project</h1>

    <div class="form-row">
      <input id = "project-name" placeholder="Project Name">
      <input id = "project-id" placeholder="Project ID">
    </div>

    <input id = "project-summary" placeholder="Project Summary">
    <textarea id = "project-description" placeholder="Project Description"></textarea>

    <div class="btn-row">
      <button class="btn btn-black" type="button" onclick="clearProjectForm()">Cancel</button>
      <button class="btn" type="button" onclick="createProject()">Confirm</button>
    </div>
  </div>
  <footer></footer>

</body>
</html>
