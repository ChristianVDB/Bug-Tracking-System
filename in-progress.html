<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="/Bug-Tracking-System/styles.css">
  <script src="script.js" defer></script>
</head>
<body data-page="in-progress">

  <div class="sidebar">
    <div class="logo">⬛ Bugiz</div>

    <a href="view-all.html" class="nav-item">Tickets</a>
    <a href="projects.html" class="nav-item">Projects</a>

    <select 
      id="status-nav" 
      class="status-dropdown"
      onchange="if (this.value) window.location.href = this.value;"
    >
      <option value="">Status</option>
      <option value="completed.html">Completed</option>
      <option value="in-progress.html">In Progress</option>
      <option value="overdue.html">Overdue</option>
    </select>

    <a href="create-ticket.html" class="nav-item">Create Ticket</a>
    <a href="create-project.html" class="nav-item">Create Project</a>
    <a href="create-user.html" class="nav-item">Create User</a>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="search">
        <input id="searchTicketInput" placeholder="Search">
      </div>
      <div class="profile">
        <div class="avatar"></div>
        <div>UserName<br>
        <a href="login.html">Log out</a>
      </div>
    </div>
  </div>

  <div class="content">
    <h1>In Progress Tickets</h1>

    <div class="table-header">
      <div>Summary</div>
      <div>Reporter</div>
      <div>Developer</div>
      <div>Status</div>
      <div>Edit</div>
      <div>View</div>
    </div>

    <div id="ticket-container"></div>
  </div>
  <footer></footer>

</body>
</html>
