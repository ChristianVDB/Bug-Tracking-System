<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Bugiz</title>
  <link rel="stylesheet" href="/Bug-Tracking-System/styles.css">
  <script src="script.js" defer></script>
</head>
<body class="login-body">

  <div class="login-container">
    <div class="login-card">

      <div class="login-logo">⬛ Bugiz</div>

      <h2>Log In</h2>
      <p class="login-subtitle">Sign in to manage your projects and tickets</p>

      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">

      <div class="btn-row">
        <button class="btn btn-black" onclick="clearLogin()">Cancel</button>
        <a class="btn btn-blue" onclick="login()">Confirm</a>
      </div>
    </div>
  </div>
</body>
</html>
